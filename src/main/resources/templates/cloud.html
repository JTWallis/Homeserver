<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
	<head>
		<title>Cloud Filesystem</title>
	</head>	
	<body>
		<h1>Filesystem</h1>
		
		<div class="header">
			<form
				th:action="@{/cloud/upload}"
				method="post"
				enctype="multipart/form-data"
				class="headerUpload"
			>
			    <label for="fileUpload" class="flexAlignCenter marginRight hoverPointer">
			        <img th:src="@{/images/icon_upload.png}" height=24 width=24>
			        <span>Upload file:</span>
			    </label>
			    <span th:text="${uploadErrorMsg}" class="overflowEllipsis errorText"></span>
			    <input type="file" name="file" class="hoverPointer inputUpload">
			    <div>
			        <input type="submit" value="Upload" class="alignRight">
			    </div>
			</form>

		    <form th:action="@{/cloud/logout}" method="post" class="alignSelfEnd">
			    <input type="submit" value="Sign out" />
		    </form>
		</div>
		
		<hr>
		
		<form th:action="@{/cloud}" method="post">
			<ul>
				<li th:each="file : ${files}">
					<div class="fileRow">
						
						<button
							type="submit"
							name="path"
							th:value="${dir} + '/' + ${file.filename}"
							class="removedBtnStyle"
						>
							<img
								th:src="@{'/images/' + ${file.iconname}}"
								width=24
								height=24
								class="marginRight"
							>
							<span 
								th:text="${file.filename}"
								class="textBlueUnderlined">
							</span>
						</button>
						
						<button th:unless="${file.filename == '..'}" class="marginLeftAuto">
						    <img
								th:src="@{/images/iconDownload.png}"
								width=24
								height=24
							>
						</button>
						
					</div>
				</li>
			</ul>
		</form>
		
	</body>
	
	<style>
		ul {
	        list-style-type: none;
	        margin: 0;
	        padding: 0;
	    }

	    button {
	        display: flex;
	        align-items: center;
	    }

	    button:hover {
	        cursor: pointer;
	    }
		
		.marginRight {
		    margin-right: 8px;
		}

		.flexAlignCenter {
		    display: flex;
		    align-items: center;
		}
		
		.alignSelfEnd {
			align-self: end;
		}

		.hoverPointer :hover {
		    cursor:pointer;        
		}
		
		.textBlueUnderlined {
			color: blue;
			text-decoration: underline;
		}
		
		.removedBtnStyle {
			border: none;
			background-color: inherit;
		}

		.marginLeftAuto {
			margin-left: auto;
		}
		

		.overflowEllipsis {
		    display: block;
		    text-overflow: ellipsis;     
		    overflow: hidden;   
		    white-space: nowrap;
		}

		.errorText {
		    color: red;      
		    font-size: 0.8rem;  
		}
		
	    .header {
	        display: flex;
	        width: 100%;
	        align-items: center;
	        justify-content: space-between;
	    }
		
		.headerUpload {
			width: 50%;
		}
		
		.inputUpload {
			max-width: 100%;
		}
		
		.fileRow {
		    display: flex;
		    width: 100%;
		    margin-top: 4px;
		    margin-bottom: 4px;
		}
	</style>
</html>
